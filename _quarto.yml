project:
  type: website
  output-dir: docs
  resources:
    - img/
    - css/
    - slides/
    - schedule/


website:
  title: "Single-cell Multiomics"
  google-analytics: G-68JBPLLNLG
  page-footer: >
      This lesson has been developed by members of the teaching team at the [Harvard Chan Bioinformatics Core (HBC)](http://bioinformatics.sph.harvard.edu/).
  
  navbar:
    left:
      - text: "Schedule"
        href: schedule/schedule.qmd
    right:
      - text: "HBC"
        href: https://bioinformatics.sph.harvard.edu/
      - text: "GitHub"
        href: https://github.com/hbctraining/Intro-to-spatial-scRNA-seq/
      - text: "Contact us"
        href: mailto:hbctraining@hsph.harvard.edu
  
  
  sidebar:
    title: "Lessons"      # Optional title above the sidebar
    style: "docked"       # Sidebar is docked to the left
    collapse-level: 1     # At what header level to start collapsing
    # contents: auto      # Creates automatic TOC from page headers (no sections)
    contents:
    
      - section: "Day 1: Protein"
        contents:
          - lessons/01_intro_multiomics.qmd
          - lessons/02_dataset.qmd
          - lessons/03_demultiplexing.qmd
          - lessons/04_protein.qmd


format:
  html:
    theme: simplex
    css: css/styles.css
    fig-align: "center"
    toc: true
    number-sections: false
    code-block-bg: true
    code-copy: true      # enables copy button (default in most themes)
    code-tools: true     # enables the copy button!
    code-line-wrap: wrap
    google-analytics: G-68JBPLLNLG
    prompt: true         
    self-contained: true
    lightbox: true

# Global Execution Defaults
execute:
  echo: true               # show code
  eval: true               # run code
  warning: false           # show warnings
  error: false             # show errors
  message: false           # show messages
  prompt: true
